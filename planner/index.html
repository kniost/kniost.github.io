(function () {
  var APP_SCRIPTS = ["dist/vendor.bundle.js?v=699f1d78", "dist/main.bundle.js?v=5b4cb0e1"];
  // runs while the page is still being parsed: write the original deferred
  // script tags, so the app starts exactly as in the unmodified page
  function boot() {
    APP_SCRIPTS.forEach(function (src) {
      document.write('<script defer src="' + src + '"><\/script>');
    });
  }
  function inMiniProgram() {
    return /miniProgram/i.test(navigator.userAgent) || window.__wxjs_environment === 'miniprogram';
  }
  // 小程序链接（公众平台生成的 wxmpurl.cn 链接，手机浏览器 / 微信里点开直接拉起小程序）
  var MINIAPP_LINK = 'https://wxmpurl.cn/ANojQtYWy1b';
  function isMobile() {
    var ua = navigator.userAgent;
    return /Mobi|Android|iPhone|iPad|iPod|HarmonyOS/i.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function showGate() {
    var mobile = isMobile();
    var go = function () {
      var sk = document.getElementById('loading-skeleton');
      if (sk) sk.remove();
      var g = document.createElement('div');
      g.id = 'miniapp-gate';
      g.innerHTML =
        '<div class="mg-card">' +
        '<div class="mg-title">岛屿规划</div>' +
        '<div class="mg-text">这个页面需要在「动森圈圈」小程序里打开</div>' +
        (mobile
          ? '<a class="mg-btn" href="' + MINIAPP_LINK + '">打开小程序</a>'
          : '<img class="mg-code" src="static/img/miniapp-code.jpg" alt="动森圈圈小程序码">' +
            '<div class="mg-hint">用微信扫一扫小程序码</div>') +
        '<div class="mg-sub">iPhone / iPad 可在动森圈圈 App 图鉴页使用</div>' +
        '<div class="mg-credit">基于开源项目 HappyIslandDesigner（MIT）修改</div>' +
        '</div>';
      document.body.appendChild(g);
      if (mobile) location.href = MINIAPP_LINK;
    };
    if (document.body) go(); else document.addEventListener('DOMContentLoaded', go);
  }
  if (inMiniProgram()) { boot(); return; }
  if (/MicroMessenger/i.test(navigator.userAgent)) {
    // WeChat: maybe the mini-program web-view (on iOS that is only known once
    // its bridge is ready, often after page load). The app has to start with
    // the page (it hooks the load event), so start it now and only cover it
    // with the gate if this turns out to be the plain WeChat browser.
    boot();
    var done = false;
    var decide = function () {
      if (done) return;
      done = true;
      if (!inMiniProgram()) showGate();
    };
    if (window.WeixinJSBridge) decide();
    else document.addEventListener('WeixinJSBridgeReady', decide, false);
    setTimeout(decide, 2500);
    return;
  }
  showGate();
})();
